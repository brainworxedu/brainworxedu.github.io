<html lang="en">
<head>

<link rel="stylesheet" href="style.css">
</head>
<body class="minimal-home"><div class="browser-nav-wrap" data-static-nav="1">
  <div class="browser-nav" role="navigation" aria-label="BrainWorks navigation">
    <div class="browser-window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <nav class="browser-tabs">
      <a class="browser-tab active" data-nav-tab="home" href="index.html"><span class="tab-favicon"><img src="assets/brainworks-logo.png" alt=""></span><span>BrainWorks</span></a>
      <a class="browser-tab" data-nav-tab="games" href="classes.html"><span class="tab-favicon"><span class="mini-play">▶</span></span><span>g@m3s</span></a>
      <a class="browser-tab" data-nav-tab="settings" href="settings.html"><span class="tab-favicon">⚙</span><span>Settings</span></a>
    </nav>
    <div class="browser-address"><span class="address-lock">⌁</span><span class="address-text">brainworks</span><span class="address-dot">•</span></div>
  </div>
</div>
<div class="bg-glow glow-a"></div><div class="bg-glow glow-b"></div>
<main class="home-main"><div class="ad-space home-ad-space" aria-label="Advertisement"></div>
  <section class="home-center">
    <div class="hero-logo-wrap"><div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div><img class="home-logo" src="assets/brainworks-logo.png" alt="BrainWorks logo"></div>
    <div class="hero-wordmark">Brainworks</div>
    <p class="home-sub" id="homeTagline">hi teach</p>
    <form class="search home-search" id="homeSearch">
      <span>⌕</span><input id="homeInput" type="search" placeholder="Search g@m3s..." autocomplete="off"><kbd>/</kbd>
    </form>
    <div id="searchResults" class="quick-results" hidden></div>
    <section class="daily-visits-card crt-counter" aria-label="Daily Visits">
      <div class="crt-scanlines" aria-hidden="true"></div>
      <div class="crt-grid" aria-hidden="true"></div>
      <div class="daily-visits-topline">
        <span class="daily-visits-eyebrow">BRAINWORX / GLOBAL NODE</span>
        <span class="daily-live"><i></i> LIVE</span>
      </div>
      <div class="daily-visits-main">
        <div class="daily-visits-copy">
          <strong>DAILY VISITS</strong>
          <span>VISITOR SIGNAL • TODAY</span>
        </div>
        <div class="daily-visits-badge-wrap" aria-label="Unique daily visitors">
          <div class="crt-frame-corners" aria-hidden="true"></div>
          <span class="daily-visits-count-shell" aria-hidden="true">
            <img id="dailyVisitsBadge" src="__brainworx_daily_visits.svg" alt="" loading="eager" decoding="async">
          </span>
          <span class="daily-visits-count-fallback" id="dailyVisitsFallback">0</span>
        </div>
      </div>
      <div class="daily-visits-footer"><span>SYS: ONLINE</span><span>BWX-DAILY-01</span></div>
    </section>
    <div class="home-links"><a href="classes.html">Browse all g@m3s →</a></div>
  </section>
</main>
<script>
  (function(){
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./daily-visits-sw.js', {scope: './'}).catch(function(){});
      }

      var today = new Date().toISOString().slice(0,10);
      var key = 'bwx-daily-visit-device-day';
      var seen = localStorage.getItem(key) === today;
      if (!seen) localStorage.setItem(key, today);

      // The service worker only calls the global counter once per browser/profile per day.
      // The badge is served locally on repeat loads so refreshing the page does not add another hit.
      var badge = document.getElementById('dailyVisitsBadge');
      var fallback = document.getElementById('dailyVisitsFallback');
      if (!badge) return;

      badge.addEventListener('error', function(){
        if (fallback) fallback.textContent = '—';
      });

      // Hide the old fallback number once the badge has loaded.
      badge.addEventListener('load', function(){
        if (fallback) fallback.style.display = 'none';
      });
    } catch (e) {}
  })();
</script>
<script src="site.js"></script>
</body>
</html>
