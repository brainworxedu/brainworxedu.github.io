<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Ops 1 Zombies</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#090507;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#landing{position:absolute;inset:0;display:grid;place-items:center;background:#120608}
#stage{position:relative;width:min(100vw,177.777778vh);aspect-ratio:16/9;overflow:hidden;background:#16090a}
#bg{width:100%;height:100%;object-fit:fill;position:absolute;inset:0;pointer-events:none}
#title{position:absolute;left:18%;top:6%;font-weight:800;font-size:clamp(14px,2.4vw,37px);letter-spacing:.1em;text-shadow:0 2px 6px #000}
#list{position:absolute;left:18.333%;top:24%;width:23.4375%;display:flex;flex-direction:column;gap:.15%;z-index:2}
.map{display:block;position:relative;width:100%;height:3.705vw;max-height:calc(100vh * .06587);min-height:23px;padding:0;border:0;cursor:pointer;background:linear-gradient(90deg,#250707,#140808);color:white;text-align:left;transition:filter .15s}
.map img{width:100%;height:100%;object-fit:fill}.map strong{position:absolute;left:2%;top:50%;transform:translateY(-50%);font-size:clamp(11px,1.35vw,25px);text-shadow:0 1px 3px #000}
.map:hover,.map.selected{filter:brightness(1.38);outline:1px solid #d8c9c955}
#panel{position:absolute;left:44.27%;top:22.22%;width:39.06%;height:66.67%;display:flex;align-items:center;justify-content:center;z-index:1}
#panel img{width:100%;height:100%;object-fit:fill}#panel-fallback{display:none;background:#241011dd;padding:1rem;font-size:clamp(12px,1.7vw,24px);line-height:1.45;border-radius:12px;min-height:50%;width:95%}
#panel-fallback h2{letter-spacing:.12em}
#actions{position:absolute;bottom:3%;left:18%;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#actions a,#actions button{background:#47171c;border:1px solid #a96565;color:white;padding:10px 15px;border-radius:7px;cursor:pointer;font-weight:700;text-decoration:none}#actions a:hover,#actions button:hover{background:#793038}
#overlay{position:fixed;inset:0;background:#060508;display:none;z-index:10}#overlay iframe{width:100%;height:100%;border:0}#bar{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}#bar>*{pointer-events:auto}#bar button,#bar a{background:#261012;color:#fff;border:1px solid #824b4e;border-radius:6px;padding:8px 12px;font:600 13px Arial;cursor:pointer;text-decoration:none}#bar>div{display:flex;gap:7px}#hint{position:absolute;bottom:0;left:0;right:0;text-align:center;background:#150a0cbb;padding:8px;font-size:11px;color:#fff8;pointer-events:none}
@media(max-width:700px){#title{top:3%}#actions{bottom:1%;gap:4px}#actions a,#actions button{padding:5px;font-size:11px}#list{top:20%}.map{height:5.6vw;min-height:0}#panel{top:15%}}
</style></head><body><div id="landing"><div id="stage"><img id="bg" src="bo1zombies_files/mapselect-supported.webp" alt="Black Ops Zombies map selection"><div id="title">MISSION SELECT</div><div id="list"></div><div id="panel"><img id="panel-image" alt="Map preview"><div id="panel-fallback"><h2 id="panel-title"></h2><p id="panel-description"></p></div></div><div id="actions"><button id="start" type="button">▶ PLAY SELECTED MAP</button><a id="open" target="_blank" rel="noopener noreferrer" href="https://vel.gg/bo1z/">Open map directly ↗</a></div></div></div>
<div id="overlay"><iframe id="external" title="Black Ops 1 Zombies map" allow="fullscreen; autoplay; pointer-lock; gamepad" allowfullscreen></iframe><div id="bar"><button type="button" id="back">← Back to maps</button><div><a id="direct" href="https://vel.gg/bo1z/" target="_blank" rel="noopener noreferrer">Open directly ↗</a><button id="full" type="button">Fullscreen</button></div></div><div id="hint">If the hosted game blocks embedding, choose “Open directly”. The full map engine was not included in the upload.</div></div>
<script>
const MAPS=[["kino", "Kino der Toten", "Battle the undead in this theatrical installment of Zombies."], ["five", "Five", "The Pentagon is under attack!"], ["riese", "Der Riese", "The Giant is rising. Battle waves of the undead."], ["nacht", "Nacht der Untoten", "Survive endless waves inside a small bunker."], ["verruckt", "Verrückt", "Escape an overrun asylum."], ["shinonuma", "Shi No Numa", "Hold your ground in the swamp."]];
const mapDir='bo1zombies_files/'; let current=0;
const list=document.getElementById('list'),img=document.getElementById('panel-image'),fallback=document.getElementById('panel-fallback');
function url(i){return 'https://vel.gg/bo1z/'+MAPS[i][0];}
MAPS.forEach(([slug,label],i)=>{let b=document.createElement('button');b.type='button';b.className='map';let pic=document.createElement('img');pic.src=mapDir+'mapselect-row-'+slug+'.webp';pic.alt=label;pic.onerror=()=>{pic.remove();let text=document.createElement('strong');text.textContent=label;b.append(text)};b.append(pic);b.addEventListener('mouseover',()=>select(i));b.addEventListener('focus',()=>select(i));b.addEventListener('click',()=>play(i));list.append(b)});
function select(i){current=i;Array.from(list.children).forEach((b,n)=>b.classList.toggle('selected',i===n));const [slug,label,description]=MAPS[i];img.style.display='';fallback.style.display='none';img.src=mapDir+'mapselect-panel-'+slug+'.webp';img.onerror=()=>{img.style.display='none';fallback.style.display='block';document.getElementById('panel-title').textContent=label;document.getElementById('panel-description').textContent=description};document.getElementById('open').href=url(i)}
function play(i){const target=url(i);document.getElementById('direct').href=target;document.getElementById('external').src=target;document.getElementById('overlay').style.display='block'}
document.getElementById('start').onclick=()=>play(current);document.getElementById('back').onclick=()=>{document.getElementById('external').src='about:blank';document.getElementById('overlay').style.display='none'};document.getElementById('full').onclick=()=>document.getElementById('external').requestFullscreen?.();select(0);
</script></body></html>
